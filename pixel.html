"use strict";
// Game logic runs in 960x600 units; it's drawn at 320x200 real pixels and scaled up.
// RES = real pixels per layout pixel: menus/text are laid out on 320x200, the game world renders at 640x400.
const W=960,H=600,LW=320,LH=200,RES=2,TAU=Math.PI*2,PH=5,MASTER=.35;
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{willReadFrequently:true});
let scale=3;
function fit(){scale=Math.max(1,Math.floor(Math.min(innerWidth/LW,innerHeight/LH)))||1;
 if(Math.min(innerWidth/LW,innerHeight/LH)<1)scale=Math.min(innerWidth/LW,innerHeight/LH);
 cv.style.width=LW*scale+'px';cv.style.height=LH*scale+'px';cv.style.transform='translate(-50%,-50%)';}
addEventListener('resize',fit);fit();

const LEVELS=[
 {name:'EASY',shape:'SUNNY SIDE',sides:3,color:'#4fc3ff',bg:'#030b16',S:.45,C:.35,half:2,
  sig:['petals','bounce'],pool:['petals','bounce','aimed','rain','ring'],calm:['petals','aimed']},
 {name:'NORMAL',shape:'SQUARE DANCE',sides:4,rot0:Math.PI/4,color:'#5dff5d',bg:'#03130a',S:.55,C:.42,half:2,
  sig:['tiles','cross4'],pool:['tiles','cross4','aimed','wall','laserRows'],calm:['cross4','aimed']},
 {name:'HARD',shape:'FIVE ALARM',sides:5,color:'#ffd23f',bg:'#141003',S:.65,C:.5,half:1,
  sig:['orbiters','starLines'],pool:['orbiters','starLines','spiral','slam','wall','aimed'],calm:['orbiters','aimed']},
 {name:'HARDER',shape:'HEX DRIVE',sides:6,color:'#ff8a2b',bg:'#160a02',S:.82,C:.7,half:1,
  sig:['hexCage','honeycomb'],pool:['hexCage','honeycomb','bombs','laserCross','spiral','wall'],calm:['honeycomb','spiral']},
 {name:'INSANE',shape:'STARBURST',star:5,color:'#ff4fd8',bg:'#13031a',S:1.05,C:1,half:0,extra:true,
  sig:['starfall','twinkle'],pool:['starfall','twinkle','dash','gridLasers','spiral','laserCross','slam'],calm:['twinkle','spiral']},
 {name:'EXTREME',shape:'DEMON CORE',star:8,color:'#ff2a2a',bg:'#160303',S:1.15,C:1.05,half:0,extra:true,

// ---------- utils ----------
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{a=rgb(a);b=rgb(b);return'#'+a.map((v,i)=>Math.round(lerp(v,b[i],t)).toString(16).padStart(2,'0')).join('');};
function prepL(L){L.dim=mix(L.bg,L.color,.35);L.mid=mix(L.bg,L.color,.6);L.light=mix(L.color,'#ffffff',.5);
 L.pal=[L.bg,mix(L.bg,L.color,.14),L.dim,L.mid,L.color,L.light,'#ffffff','#000000'].map(rgb);return L;}
LEVELS.forEach(prepL);
const MENU_BG='#05030a';
const EXTRA_COLORS=[{name:'CYAN',c:'#3fffe0',bg:'#021412'},{name:'PURPLE',c:'#a77bff',bg:'#0a0518'}];
const MENU_PAL=[MENU_BG,'#000000','#ffffff','#3a3a4a',...LEVELS.flatMap(L=>[L.color,mix(MENU_BG,L.color,.3)]),...EXTRA_COLORS.flatMap(e=>[e.c,mix(MENU_BG,e.c,.3)])].map(rgb);
function shapePts(L,r,rot){const p=[];rot+=L.rot0||0;
 if(L.star){const n=L.star*2;for(let i=0;i<n;i++){const a=rot+i*TAU/n-Math.PI/2,rr=i%2?r*(L.star>5?.55:.45):r;p.push([Math.cos(a)*rr,Math.sin(a)*rr]);}}
 else for(let i=0;i<L.sides;i++){const a=rot+i*TAU/L.sides-Math.PI/2;p.push([Math.cos(a)*r,Math.sin(a)*r]);}
 return p;}
function poly(pts,x,y){ctx.beginPath();pts.forEach(([a,b],i)=>i?ctx.lineTo(x+a,y+b):ctx.moveTo(x+a,y+b));ctx.closePath();}
// snap a game-unit rect to the pixel grid
const PX=3/RES;function rr(x,y,w,h){ctx.fillRect(Math.round(x/PX)*PX,Math.round(y/PX)*PX,Math.max(PX,Math.round(w/PX)*PX),Math.max(PX,Math.round(h/PX)*PX));}

// Hard-edged palette: every pixel snaps to the nearest palette color
const pcache=new WeakMap();
function posterize(pal){
 const id=ctx.getImageData(0,0,cv.width,cv.height),u=new Uint32Array(id.data.buffer),n=pal.length;
 let m=pcache.get(pal);if(!m||m.size>8192){m=new Map();pcache.set(pal,m);}
 let lastIn=-1,lastOut=0;
 for(let i=0;i<u.length;i++){const c=u[i]|0xff000000;
  if(c===lastIn){u[i]=lastOut;continue;}
  let o=m.get(c);
  if(o===undefined){const r=c&255,g=c>>8&255,b=c>>16&255;let bi=0,bd=1e9;
   for(let j=0;j<n;j++){const p=pal[j],dr=r-p[0],dg=g-p[1],db=b-p[2],dd=dr*dr+dg*dg+db*db;if(dd<bd){bd=dd;bi=j;}}
   const p=pal[bi];o=(0xff000000|p[2]<<16|p[1]<<8|p[0])>>>0;m.set(c,o);}
  lastIn=c;lastOut=o;u[i]=o;}
 ctx.putImageData(id,0,0);}

function txt(s,x,y,col,sc=1,al=0){s=String(s).toUpperCase();const w=tw(s,sc);x=Math.round(al==1?x-w/2:al==2?x-w:x);y=Math.round(y);

function frame(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);}

function btn(x,y,w,h,label,col,fn){const hov=mouse.x>=x&&mouse.x<x+w&&mouse.y>=y&&mouse.y<y+h;
 ctx.fillStyle=hov?col:'#000000';ctx.fillRect(x,y,w,h);frame(x,y,w,h,col);txt(label,x+w/2,y+Math.floor((h-5)/2),hov?'#000000':col,1,1);ui.push({x,y,w,h,fn});}

// ---------- storage ----------
const DB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('pixelgame',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res();}catch(e){res()}})},
 put(k,v){if(!this.db)return;try{const s=this.db.transaction('songs','readwrite').objectStore('songs');v===null?s.delete(k):s.put(v,k);}catch(e){}},
 clear(){if(!this.db)return;try{this.db.transaction('songs','readwrite').objectStore('songs').clear();}catch(e){}},
 get(k){return new Promise(res=>{if(!this.db)return res(null);const r=this.db.transaction('songs').objectStore('songs').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);})}};

// ---------- audio ----------
// every sound goes through masterOut, so mute is one switch
let muted=localStorage.pixel_muted==='1',masterOut=null;
let vol=localStorage.pixel_vol!=null?+localStorage.pixel_vol:10; // 0..10
const outGain=()=>muted?0:Math.pow(vol/10,1.6);
function applyVol(){if(masterOut)masterOut.gain.setValueAtTime(outGain(),actx.currentTime);}
function toggleMute(){muted=!muted;localStorage.pixel_muted=muted?'1':'0';applyVol();}
function setVol(v){vol=clamp(Math.round(v),0,10);localStorage.pixel_vol=vol;if(vol>0&&muted){muted=false;localStorage.pixel_muted='0';}applyVol();}
let actx,gain,analyser,src=null,startAt=0,freq;
function ensureAudio(){
 if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();gain=actx.createGain();analyser=actx.createAnalyser();analyser.fftSize=256;
  freq=new Uint8Array(analyser.frequencyBinCount);gain.connect(analyser);
  masterOut=actx.createGain();masterOut.gain.value=outGain();masterOut.connect(actx.destination);analyser.connect(masterOut);}
 if(actx.state==='suspended')actx.resume();
}
function stopSong(){if(src){try{src.stop()}catch(e){}try{src.disconnect()}catch(e){}src=null;}}
function playSong(buf,off=0){
 stopSong();const now=actx.currentTime;
 gain.gain.cancelScheduledValues(now);gain.gain.setValueAtTime(MASTER,now);
 src=actx.createBufferSource();src.buffer=buf;src.connect(gain);startAt=now+0.15-off;src.start(now+0.15,off);
}

// Beat detection: onset envelope -> tempo by autocorrelation -> beat grid fit -> loudness per beat
function analyze(buf){
 const sr=buf.sampleRate,n=buf.length,a=buf.getChannelData(0),b=buf.numberOfChannels>1?buf.getChannelData(1):null;
 const hop=512,F=Math.floor(n/hop),fd=hop/sr,low=new Float32Array(F),full=new Float32Array(F);
 const al=1-Math.exp(-TAU*150/sr);let lp=0,idx=0;
 for(let f=0;f<F;f++){let el=0,ef=0;for(let j=0;j<hop;j++,idx++){const s=b?(a[idx]+b[idx])*.5:a[idx];lp+=al*(s-lp);el+=lp*lp;ef+=s*s;}
  low[f]=Math.sqrt(el/hop);full[f]=Math.sqrt(ef/hop);}
 const o=new Float32Array(F);
 for(let f=1;f<F;f++)o[f]=Math.max(0,low[f]-low[f-1])*2+Math.max(0,full[f]-full[f-1]);
 const ps=new Float64Array(F+1);for(let f=0;f<F;f++)ps[f+1]=ps[f]+o[f];
 const wn=Math.round(.4/fd),o2=new Float32Array(F);
 for(let f=0;f<F;f++){const lo=Math.max(0,f-wn),hi=Math.min(F,f+wn+1);o2[f]=Math.max(0,o[f]-(ps[hi]-ps[lo])/(hi-lo));}
 let bestS=0,bestLag=0;const minL=Math.floor(60/190/fd),maxL=Math.ceil(60/72/fd);
 for(let L=minL;L<=maxL;L++){let s=0;for(let f=L;f<F;f++)s+=o2[f]*o2[f-L];
  const bpm=60/(L*fd);s=s/(F-L)*Math.exp(-.5*Math.pow(Math.log2(bpm/128)/.9,2));if(s>bestS){bestS=s;bestLag=L;}}
 let per=bestLag||Math.round(.5/fd),phase=0;
 if(bestS>0){let bs=-1;
  for(let p=bestLag-1.5;p<=bestLag+1.5;p+=.01){for(let ph=0;ph<p;ph+=1){let s=0;
   for(let x=ph;x<F-1;x+=p){const i=Math.round(x);s+=Math.max(o2[i],o2[i+1]||0,o2[i-1]||0);}
   if(s>bs){bs=s;per=p;phase=ph;}}}}
 const bp=per*fd,beats=[];
 for(let x=phase;x*fd<buf.duration;x+=per)beats.push({t:x*fd,i:0});
 const v=beats.map(bt=>{const f0=Math.round(bt.t/fd),f1=Math.min(F,Math.round((bt.t+bp)/fd));let s=0;for(let f=f0;f<f1;f++)s+=full[f];return s/Math.max(1,f1-f0);});
 const sorted=v.slice().sort((x,y)=>x-y),mx=sorted[sorted.length-1]||1;
 const p10=sorted[Math.floor(sorted.length*.1)]||0,p95=sorted[Math.floor(sorted.length*.95)]||mx;
 beats.forEach((bt,k)=>{bt.i=v[k]<mx*.04?0:clamp((v[k]-p10)/Math.max(1e-6,p95-p10)*.85+.15);});
 return{beats,bp,dur:buf.duration,bpm:Math.round(60/bp)};
}

const NOTE=m=>440*Math.pow(2,(m-69)/12);

// one synth voice added into a buffer
function tone(out,sr,t0,dur,f,o,g=1){
 const s0=Math.max(0,Math.round(t0*sr)),n=Math.round(dur*sr),rel=Math.round(.015*sr),end=Math.min(out.length,s0+n+rel);
 const vol=(o.vol||.1)*g,att=Math.max(1,(o.a||.004)*sr),k=Math.exp(-(o.dec||0)/sr),ca=o.cut?1-Math.exp(-TAU*o.cut/sr):0,
  wc={sq:0,saw:1,tri:2,ss:3}[o.w]??4,duty=o.duty||.5,det=o.det||0,inc=f/sr,vib=o.vib||0,sl=o.slide?Math.round(.05*sr):0,sm=o.slide?Math.pow(2,o.slide/12)-1:0;
 let ph=0,ph2=.33,ph3=.66,lp=0,env=1,vf=1;
 for(let j=s0,i=0;j<end;j++,i++){
  let fi=inc;if(vib!==0){if((i&15)===0)vf=1+vib*Math.sin(i*TAU*5.5/sr)*Math.min(1,i/(sr*.25));fi*=vf;}
  if(i<sl)fi*=1+sm*(1-i/sl);
  ph+=fi;if(ph>=1)ph-=1;let v;
  if(wc===0)v=ph<duty?1:-1;else if(wc===1)v=2*ph-1;else if(wc===2)v=1-4*Math.abs(ph-.5);
  else if(wc===3){ph2+=fi*(1+det);ph3+=fi*(1-det);if(ph2>=1)ph2-=1;if(ph3>=1)ph3-=1;v=(ph+ph2+ph3)*.66-1;}
  else v=Math.sin(TAU*ph);
  if(ca!==0){lp+=ca*(v-lp);v=lp;}
  let e=i<att?env*i/att:env;env*=k;if(i>n)e*=1-(i-n)/rel;
  out[j]+=v*e*vol;}}
function kick(out,sr,t,vol,hard){const s0=Math.round(t*sr),n=Math.round((hard?.42:.3)*sr),
 kp=Math.exp(-(hard?22:32)/sr),ka=Math.exp(-(hard?5:8)/sr),sw=(hard?170:110)*TAU/sr,base=42*TAU/sr;let ph=0,ep=1,ea=1;
 for(let i=0;i<n&&s0+i<out.length;i++){ph+=base+sw*ep;ep*=kp;let v=Math.sin(ph)*ea;ea*=ka;if(hard)v=Math.tanh(v*4)*.7;out[s0+i]+=v*vol;}}
let nseed=12345;const nrand=()=>(nseed=nseed*1103515245+12345>>>0)/2147483648-1;
function noise(out,sr,t,len,vol,dec,hp,body=0){const s0=Math.round(t*sr),n=Math.round(len*sr),k=Math.exp(-dec/sr),kb=Math.exp(-25/sr),bi=TAU*body/sr;
 let pr=0,ph=0,e=vol,eb=1;
 for(let i=0;i<n&&s0+i<out.length;i++){const r=nrand();let v=hp?r-pr:r;pr=r;
  if(body){ph+=bi;v=v*.7+Math.sin(ph)*eb;eb*=kb;}out[s0+i]+=v*e;e*=k;}}
function riser(out,sr,t,len,vol){const s0=Math.round(t*sr),n=Math.round(len*sr);let lp=0;
 for(let i=0;i<n&&s0+i<out.length;i++){const p=i/n,r=nrand();lp+=(.02+.5*p*p)*(r-lp);out[s0+i]+=lp*p*p*vol;}}

// motif = 2 bars of 16th-note steps, pitches as scale degrees relative to the current chord root
function motif(r,dens,maxLen){const m=[];let d=0,s=0;
 while(s<32){const strong=s%4==0;
  if(s==0||r()<(strong?dens+.3:dens)){let len=Math.min(1+Math.floor(r()*maxLen),32-s);
   d=clamp(d+Math.round((r()-.5)*4.4),-2,9);if(strong&&r()<.7)d=Math.round(d/2)*2;m.push({s,len,d});s+=len;}
  else s++;}
 return m;}
const mAnswer=(m,r)=>m.map((n,i)=>i<m.length*.6?n:{...n,d:i==m.length-1?(r()<.5?0:-3):clamp(n.d+Math.round((r()-.5)*5),-2,9)});
const mShift=(m,k)=>m.map(n=>({...n,d:clamp(n.d+k,-3,10)}));
const mDevelop=(m,r)=>m.map(n=>r()<.35?{...n,d:clamp(n.d+(r()<.5?-2:2),-2,9)}:n);
const mRhythm=(m,r)=>{const o=[];m.forEach(n=>{if(n.len>=2&&r()<.5){const h=n.len>>1;o.push({...n,len:h},{s:n.s+h,len:n.len-h,d:n.d+(r()<.5?1:-1)});}else o.push(n);});return o;};
const mVariants=(m,r)=>[m,mAnswer(m,r),mRhythm(mShift(m,r()<.5?2:-1),r),mAnswer(mDevelop(m,r),r)];

// mixdown: sidechain duck + ping-pong delay on the lead bus + soft clip
function mixdown(main,Rc,duck,lead,kicks,dl,sr){
 const N=main.length,rL=new Float32Array(dl),rR=new Float32Array(dl),kd=Math.exp(-1/(.11*sr));
 let ki=0,de=0,p=0;
 for(let i=0;i<N;i++){
  while(ki<kicks.length&&kicks[ki]<=i){de=.65;ki++;}de*=kd;
  const x=lead[i],oL=rL[p],oR=rR[p];rL[p]=x*.45+oR*.38;rR[p]=oL;if(++p===dl)p=0;
  const m=main[i]+duck[i]*(1-de);
  main[i]=Math.tanh((m+x+oL*.7)*1.1)*.92;Rc[i]=Math.tanh((m+x+oR*.7)*1.1)*.92;}}
function compose(li,M=MUSIC[li]){
 const r=mulberry(li*1013+77),sr=32000,spb=60/M.bpm,st=spb/4,off=.6;
 const sc=SCALES[M.scale],deg=d=>{const o=Math.floor(d/7);return M.root+o*12+sc[d-o*7];};
 let bars=0;M.form.forEach(f=>bars+=f[1]);
 const end=off+bars*4*spb,N=Math.ceil((end+2.5)*sr);
 const buf=actx.createBuffer(2,N,sr),main=buf.getChannelData(0),Rc=buf.getChannelData(1);
 const duck=new Float32Array(N),lead=new Float32Array(N),kicks=[],beats=[],motifs={},seen={},D=DRUMS[M.drums];
 const stepT=(T,s)=>T+s*st+(s%2?M.swing*st:0);
 let bar=0;
 for(const [type,nb] of M.form){
  const S=SEC[type],occ=seen[type]=(seen[type]||0)+1,prog=M.prog[(type=='B'||type=='break'||(type=='A'&&occ>1))?1:0];
  let vars=null;const vb=[];
  if(S.lead){if(!motifs[S.lead])motifs[S.lead]=motif(r,S.dens,S.maxLen);else motifs[S.lead]=mDevelop(motifs[S.lead],r);vars=mVariants(motifs[S.lead],r);}
  if(S.riser)riser(main,sr,off+bar*4*spb,nb*4*spb,.22);
  for(let b=0;b<nb;b++,bar++){
   const T=off+bar*4*spb,c=prog[b%prog.length],g=S.fade?1-b/nb*.8:1,lastBar=b==nb-1,fill=b%4==3;
   for(let q=0;q<4;q++)beats.push({t:T+q*spb,i:clamp(S.i+(S.ramp||0)*(b*4+q)/(nb*4)+(q==0?.05:0)),sec:type,drop:type=='drop'&&b==0&&q==0});
   // drums
   if(S.crash&&b==0)noise(main,sr,T,1.6,.16,2.2,1);
   if(type=='A'&&b==0&&occ>1)noise(main,sr,T,1.2,.1,3,1);
   for(let s=0;s<16;s++){const t=stepT(T,s);
    if(type=='B'&&lastBar&&s>=12)continue; // drop-out right before the drop
    let kk=S.kick&&D.k[s]=='x'&&(S.kick!=='half'||s%8==0);
    if(S.kick===1&&!kk&&s==14&&D.k[s]=='.'&&r()<.22)kk=true;
    if(kk){kick(main,sr,t,(D.hard&&type=='drop'?.6:.85)*g,D.hard&&type=='drop');kicks.push(Math.round(t*sr));}
    if(S.snare==='roll'){const rem=nb-b,every=rem>2?4:rem==2?2:1;
     if((s%every==0)&&(rem<=2||s%8==4))noise(main,sr,t,.15,(.12+.3*(b*16+s)/(nb*16))*g,24,0,190);}
    else if(S.snare){let sn=D.s[s];
     if(fill&&!lastBar&&s>=12&&r()<.55)sn=s==12||r()<.7?'x':'o';
     if(sn=='x'){noise(main,sr,t,.2,.38*g,20,0,185);if(D.clap)noise(main,sr,t+.012,.12,.15,30,1);}
     else if(sn=='o')noise(main,sr,t,.08,.12*g,40,0,185);}
    if(S.hat&&D.h[s]=='x'&&(S.hat==2||s%2==0))noise(main,sr,t,.04,(s%4==0?.07:.11)*g,75,1);
    if(S.hat==2&&D.o[s]=='x')noise(main,sr,t,.22,.08*g,13,1);}
   // bass (into the ducked bus so the kick pumps it)
   if(S.bass)for(const [s,len,dd] of BASS[M.bass]){if(type=='B'&&lastBar&&s>=12)continue;
    const n=deg(c+dd)-24;tone(duck,sr,stepT(T,s),len*st*.92,NOTE(n),M.bassI,g);
    if(S.bass==2&&M.bass!='reese'&&len>=2)tone(duck,sr,stepT(T,s)+st,st*.6,NOTE(n+12),M.bassI,g*.45);}
   // pad
   if(S.pad)for(const x of [0,2,4])tone(duck,sr,T,4*spb,NOTE(deg(c+x)),{...M.pad,a:.15,dec:.25},g*(type=='break'?1.4:1));
   // lead melody
   if(vars){const blk=Math.floor(b/8),v=blk?(vb[blk]=vb[blk]||mVariants(mDevelop(motifs[S.lead],r),r)):vars,ph=v[(b>>1)%4],half=b%2;
    const L=S.soft?{w:'tri',vol:.16,dec:1.5,vib:.008}:M.lead;
    for(const n of ph){if(n.s<half*16||n.s>=half*16+16)continue;
     if(type=='B'&&lastBar&&n.s-half*16>=12)continue;
     tone(lead,sr,stepT(T,n.s-half*16),n.len*st*.9,NOTE(deg(c+n.d)+12),L,g);}}
   // arpeggio
   if(S.arp){const tn=[0,2,4,7].map(x=>deg(c+x)+12);
    for(let s=0;s<16;s+=M.arpRate){if(type=='B'&&lastBar&&s>=12)continue;
     const j=M.arp=='up'?s%4:M.arp=='down'?3-s%4:M.arp=='updown'?[0,1,2,3,2,1][(s/M.arpRate)%6]:M.arp=='rand'?Math.floor(r()*4):s%4;
     const oct=M.arp=='fast'&&(s>>2)%2?12:0;
     tone(lead,sr,stepT(T,s),st*.7,NOTE(tn[j]+oct),{w:'sq',duty:.5,vol:.035,dec:14},g*(S.lead?.8:1));}}
  }
 }
 mixdown(main,Rc,duck,lead,kicks.sort((a,b)=>a-b),Math.round(st*3*sr),sr);
 return{name:M.title,buffer:buf,an:{beats,bp:spb,dur:end+.3,bpm:M.bpm,loop:[off,end]}};
}

const MENU_MUSIC={title:'MAIN MENU',bpm:96,root:57,scale:'dorian',prog:[[0,3,5,4],[0,5,3,6]],drums:'pop',bass:'bounce',swing:.16,
 lead:{w:'tri',vol:.2,dec:1.8,vib:.007},bassI:{w:'tri',vol:.26,dec:3},arp:'updown',arpRate:2,pad:{w:'tri',vol:.045},
 form:[['intro',4],['A',8],['break',4],['A',8]]};
let menuSong=null,menuSrc=null,menuGain=null;
function playMenuMusic(){
 if(!actx||menuSrc||(state!=='menu'&&state!=='loading'&&state!=='editor'))return;
 if(!menuSong)menuSong=compose(6,MENU_MUSIC);
 if(!menuGain){menuGain=actx.createGain();menuGain.connect(masterOut);}
 const now=actx.currentTime;menuGain.gain.cancelScheduledValues(now);menuGain.gain.setValueAtTime(0,now);menuGain.gain.linearRampToValueAtTime(MASTER*.85,now+1.5);
 menuSrc=actx.createBufferSource();menuSrc.buffer=menuSong.buffer;menuSrc.loop=true;
 [menuSrc.loopStart,menuSrc.loopEnd]=menuSong.an.loop;menuSrc.connect(menuGain);menuSrc.start(now);}
function stopMenuMusic(){if(!menuSrc)return;const s=menuSrc,now=actx.currentTime;menuSrc=null;
 menuGain.gain.cancelScheduledValues(now);menuGain.gain.setValueAtTime(menuGain.gain.value,now);menuGain.gain.linearRampToValueAtTime(0,now+.25);
 try{s.stop(now+.3)}catch(e){}}
// browsers only allow sound after the first click or key press
function menuMusicSoon(){setTimeout(()=>{if(state==='menu'||state==='editor'){ensureAudio();playMenuMusic();}},0);}

// ---------- death sound: falling square-wave sweep + crunch + low boom ----------
let deathBuf=null;
function playDeathSfx(){
 if(!deathBuf){const sr=32000,n=Math.round(1.1*sr);deathBuf=actx.createBuffer(1,n,sr);const d=deathBuf.getChannelData(0);
  let ph=0,ph2=0,lp=0;
  for(let i=0;i<n;i++){const x=i/sr;
   const f=880*Math.pow(55/880,Math.min(1,x/.75));ph+=f/sr;ph-=Math.floor(ph);
   let v=(ph<.5?1:-1)*.32*Math.exp(-x*2.2)*(Math.floor(x*28)%2?1:.55);  // stuttering descending tone
   const nz=nrand();lp+=.35*(nz-lp);v+=lp*.55*Math.exp(-x*9);              // crunch
   ph2+=TAU*(38+70*Math.exp(-x*12))/sr;v+=Math.sin(ph2)*.6*Math.exp(-x*5); // boom
   d[i]=Math.tanh(v*1.3)*.85;}}
 const g=actx.createGain();g.gain.value=MASTER*1.4;g.connect(masterOut);
 const s=actx.createBufferSource();s.buffer=deathBuf;s.connect(g);s.start();}
function levelSong(li){if(songCache.li!==li)songCache={li,song:compose(li)};return songCache.song;}

const keys={};
// No luck involved: every beat, and every scheduled attack step, draws from its own fixed seed, so the same
// song always produces the same attacks at the same moments, no matter where you stand or how fast the game runs.
const seedMix=(a,b)=>{let h=Math.imul(a^0x9e3779b9,0x85ebca6b)^Math.imul(b+0x632be5ab,0xc2b2ae35);h^=h>>>16;h=Math.imul(h,0x7feb352d);return(h^h>>>15)>>>0;};
function rng(){return G.rng()}
function at(t,fn){G.ev.push({t,fn,s:seedMix(G.ctx.s,++G.ctx.n)})}
function bullet(x,y,ang,spd,s=12,o){const b={type:'bullet',x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,s,t0:G.t};if(o)Object.assign(b,o);if(b.split)b.rs=rng();G.haz.push(b);return b;}
function laser(x,y,ang,w,t0,t1,o={}){const l=Object.assign({type:'laser',x,y,ang,w,t0,t1,rot:0},o);G.haz.push(l);return l;}
function moveBoss(x,y,t0,t1,hop=0,harm=0){boss.tw={x0:boss.x,y0:boss.y,x1:x,y1:y,t0,t1,hop,harm};}
// pick a new spot far from the player whose straight-line route also stays clear of them
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1,u=clamp(((px-ax)*dx+(py-ay)*dy)/l);return Math.hypot(px-ax-dx*u,py-ay-dy*u);}
function bossSpot(minD=230){const c=[];for(let i=0;i<12;i++)c.push({x:200+rng()*560,y:130+rng()*340});
 const score=q=>Math.min(Math.hypot(q.x-P.x,q.y-P.y)/minD,segDist(P.x,P.y,boss.x,boss.y,q.x,q.y)/140);
 return c.find(q=>score(q)>=1)||c.reduce((a,q)=>score(q)>score(a)?q:a);}
function rayEnd(x,y,a,m){const c=Math.cos(a),s=Math.sin(a);const tx=c>0?(W-m-x)/c:c<0?(m-x)/c:1e9,ty=s>0?(H-m-y)/s:s<0?(m-y)/s:1e9;const t=Math.max(0,Math.min(tx,ty));return{x:x+c*t,y:y+s*t};}
function burst(x,y,col,n,sp=260){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=sp*(.3+Math.random());G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.5,s:3+Math.random()*6,c:col});}}
function ringBullets(n,spd,off=0,s=12){n=Math.max(3,Math.round(n));for(let j=0;j<n;j++)bullet(boss.x,boss.y,off+j*TAU/n,spd,s);}

const PAT={
 ring(k,T,a){at(T,()=>ringBullets((9+a*9)*G.C,170*G.S*(.8+a*.4),k*.3));},

  const c=G.C<.6?(a>.6?3:1):(a>.6?5:3);at(T,()=>shot(c,270*G.S));if(G.C>=.85&&a>.7&&k%2)at(T+G.bp/2,()=>shot(2,300*G.S));},
 spiral(k,T,a){const sub=a>.6&&G.C>=.85?4:2,arms=3+(G.D>=5?1:0);
  for(let s=0;s<sub;s++)at(T+s*G.bp/sub,()=>{G.spin+=.32*G.bs.dir;for(let j=0;j<arms;j++)bullet(boss.x,boss.y,G.spin+j*TAU/arms,190*G.S,11);});},
 wall(k,T,a){if(k%2)return;const side=G.bs.side,gap=270-G.D*15,dur=3.6*G.bp/G.S,T0=T+G.bp,
   drift=(lo,hi)=>{const c=G.wallG==null?lo+rng()*(hi-lo):clamp(G.wallG+(rng()-.5)*260,lo,hi);G.wallG=c;return c;};
  if(side<2){const gy=drift(60,H-60-gap),vx=(W+80)/dur*(side?-1:1),x=side?W:-40;

  else{const gx=drift(60,W-60-gap),vy=(H+80)/dur*(side==3?-1:1),y=side==3?H:-40;
   [[0,gx],[gx+gap,W-gx-gap]].forEach(([x,w])=>G.haz.push({type:'rect',wall:1,x,y,w,h:42,vx:0,vy,t0:T0,t1:T0+dur+1,warn:{x,y:side==3?H-24:0,w,h:24}}));}},

 laserCross(k,T,a){

   if(a>.7)bullet(boss.x,boss.y,0,0,12,{cx:boss.x,cy:boss.y,r:20,vr:62*G.S,a:o+(j+.5)*TAU/5,va:-1.4*dir});}});
  else if(k%4==2)PAT.aimed(k,T,a);},
 starLines(k,T,a){if(k%4==0){const a0=rng()*TAU,dir=G.bs.dir;for(let j=0;j<5;j++)laser(boss.x,boss.y,a0+j*TAU/5,20,T,T+G.bp*2,{rot:dir*.25*G.S,follow:1});}
  else if(k%4==2&&a>.5)at(T,()=>ringBullets(10*G.C,150*G.S,rng()*TAU,11));},
 // HARDER / hexagon: expanding hexagons with one open side, bullets that hatch into 6

  G.hexGap=((G.hexGap||0)+(rng()<.5?1:-1)+6)%6;G.hexRot=(G.hexRot||0)+.12*G.bs.dir;
  G.haz.push({type:'hex',x:W/2,y:H/2,R0:50,R:50,v:150*G.S,t0:T,gap:G.hexGap,rot:G.hexRot,th:20});
  },

  bullet(boss.x,boss.y,ang,260*G.S,26,{split:T+G.bp*1.5,n:6,drag:1.2});
  if(a>.7)bullet(boss.x,boss.y,ang+Math.PI+(rng()-.5),260*G.S,26,{split:T+G.bp*1.5,n:6,drag:1.2});});},
 // INSANE / star: falling comets, sparkles that pop into crosses
 starfall(k,T,a){if(k%2)return;const n=a>.7?3:2;for(let j=0;j<n;j++){const x0=40+rng()*(W-80),ang=Math.PI/2+(rng()-.5)*.9,e=rayEnd(x0,-30,ang,-30);
   G.haz.push({type:'dashwarn',x1:x0,y1:-30,x2:e.x,y2:e.y,w:22,t1:T+G.bp});
   at(T+G.bp,()=>bullet(x0,-30,ang,620*G.S,22,{trail:1}));}},

  for(let j=0;j<n;j++){const x=60+rng()*(W-120),y=60+rng()*(H-120);G.haz.push({type:'mark',x,y,r:34,t1:T1});
   at(T1,()=>{const o=(k>>1)%2?Math.PI/4:0,m=a>.85?8:4;for(let q=0;q<m;q++)bullet(x,y,o+q*TAU/m,220*G.S,12);
    G.haz.push({type:'ring',x,y,r0:6,vr:400,th:12,rMax:46,t0:T1,dmg:true});burst(x,y,G.L.color,10);});}},
 // EXTREME / demon: gravity well that drags you in, sweeping 8-ray lasers, wobbling hellfire
 blackhole(k,T,a){if(k==0){moveBoss(W/2,H/2,T-G.bp,T,.2);at(T,()=>{G.pull={t1:T+G.bp*7.5,str:95*G.S};G.flash=.4;});}
  if(k>=1&&k<8)at(T,()=>{const n=Math.round(7*G.C),o=rng()*TAU;
   for(let j=0;j<n;j++){const ang=o+j*TAU/n,e=rayEnd(boss.x,boss.y,ang,-20);bullet(e.x,e.y,ang+Math.PI,150*G.S,13,{sink:1});}
   G.haz.push({type:'ring',x:boss.x,y:boss.y,r0:520,vr:-700,th:4,rMax:9999,t0:T,dmg:false});});},

   for(let j=0;j<4;j++)ls.push(laser(boss.x,boss.y,a0+j*Math.PI/4,22,T+G.bp,T+G.bp*7,{rot:dir*.32*G.S,follow:1}));
   at(T+G.bp*4,()=>ls.forEach(l=>l.rot*=-1.15));}
  else if(k%4==2)PAT.aimed(k,T,a);},
 hellrain(k,T,a){at(T,()=>{const n=Math.round((3+a*4)*G.C);for(let j=0;j<n;j++)bullet(rng()*W,-20,Math.PI/2,(130+rng()*90)*G.S,12,{wob:3+rng()*2,wa:120,ph:rng()*TAU});});},
};
// attacks that are unfair back-to-back (the first one's hazards are still on screen when the second starts)
const CLASH={hexCage:['wall','laserCross'],wall:['hexCage'],laserCross:['hexCage']};
const BOSS_MOVERS=['slam','dash','laserCross','blackhole','hexCage'];

function onBeat(i){
 const bt=G.beats[i],T=bt.t;G.ctx={s:seedMix(G.seed,i),n:0};G.rng=mulberry(G.ctx.s);
 at(T,()=>{G.pulse=1;boss.pulse=1;});
 if(T<2)return;
 if(i%8===0||G.bs.k0<0){
  let s=0,c=0;for(let j=i;j<Math.min(i+8,G.beats.length);j++){s+=G.beats[j].i;c++;}const avg=s/c;
  let tier=avg<.15?'rest':avg<.45?'calm':'hype';const pool=tier=='calm'?G.L.calm:G.L.pool;
  // a drop (built-in songs mark it; for MP3s, a sudden jump in loudness) always opens with a signature attack
  const drop=bt.drop||(bt.sec==null&&tier=='hype'&&avg-G.lastAvg>.3);
  const box=G.L.blocks?G.L.blocks[Math.floor(i/8)]||'auto':'auto';G.forced=box!=='auto'&&box!=='rest';
  let p=null;
  if(box==='rest')p=null;
  else if(G.forced){p=box;if(tier==='rest')tier='calm';}
  else if(tier!='rest'){
   const ok=x=>!(CLASH[G.pat]||[]).includes(x);
   if(drop){G.sigI=(G.sigI||0)+1;p=G.L.sig[G.sigI%G.L.sig.length];if(!ok(p)){G.sigI++;p=G.L.sig[G.sigI%G.L.sig.length];}}
   else{let opts=pool.filter(x=>!G.hist.includes(x)&&ok(x));if(!opts.length)opts=pool.filter(x=>x!==G.pat&&ok(x));p=opts[Math.floor(rng()*opts.length)]||pool[0];}
   G.hist.push(p);if(G.hist.length>2)G.hist.shift();}
  if(drop)at(T,()=>{G.flash=.6;G.shake=12;G.haz.push({type:'ring',x:boss.x,y:boss.y,r0:40,vr:900,th:6,rMax:1200,t0:T,dmg:false});});
  if(p!==G.pat){G.wallG=null;G.haz=G.haz.filter(h=>{if(h.type==='hex'||h.wall){burst(h.type==='hex'?h.x:h.x+h.w/2,h.type==='hex'?h.y:h.y+h.h/2,G.L.color,4,150);return false;}return true;});}
  G.pat=p;G.tier=tier;G.lastAvg=avg;G.bs={k0:i,side:Math.floor(rng()*4),dir:rng()<.5?1:-1};
  if(p&&!BOSS_MOVERS.includes(p)){const d=bossSpot();moveBoss(d.x,d.y,T-G.bp,T,.15);G.haz.push({type:'mark',x:d.x,y:d.y,r:75,t1:T});}
 }
 const k=i-G.bs.k0;
 // Easy: attack every other beat. Normal: every other beat unless the song is loud.
 if(G.L.half==2&&k%2)return;
 if(G.L.half==1&&k%2&&bt.i<.85)return;
 if(G.pat&&(bt.i>=.08||G.forced)){PAT[G.pat](k,T,Math.max(bt.i,G.forced?.5:0));
  if(G.L.extra&&G.tier=='hype'&&k%4==3&&G.pat!='ring')at(T,()=>ringBullets(8,140*G.S,rng()*TAU,10));}
}

function startLevel(li,song,L=LEVELS[li],from=0,test=false){
 G={li,L,song,beats:song.an.beats,bp:song.an.bp,dur:song.an.dur,bpm:song.an.bpm,t:from,bi:from?Math.max(0,song.an.beats.findIndex(b=>b.t>=from)):0,ev:[],haz:[],parts:[],
  seed:(typeof li==='number'?li*7919:[...String(li)].reduce((h,c)=>h*31+c.charCodeAt(0)|0,7))+Math.round(song.an.dur*1000),from,test,ctx:{s:1,n:0},rng:mulberry(1),D:L.D,S:L.S,C:L.C,pat:null,tier:'rest',bs:{k0:-1},lastAvg:0,
  spin:0,shake:0,flash:0,hitFlash:0,pulse:0,trail:[],hist:[],graze:0,pull:null};
 P={x:W/2,y:H-90,hp:L.hp||3,inv:0};
 boss={x:W/2,y:200,rot:0,pulse:0,z:0,tw:null,dead:false};
 msg=null;state='play';stopMenuMusic();playSong(song.buffer,from);
}

function hurt(src){if(P.inv>0||state!=='play')return;
 for(const b of G.haz)if(b.type==='bullet'&&(b.near||(src&&b.t0===src.t0)))b.nog=1;P.hp--;P.inv=1.6;G.shake=14;G.hitFlash=1;burst(P.x,P.y,'#ffffff',22);if(P.hp<=0)die();}
function pct(){return Math.floor(clamp(G.t/G.dur)*100);}
function saveBest(p){if(!G.test&&p>best(G.li))localStorage['pixel_best_'+G.li]=p;}
function die(){
 state='dead';playDeathSfx();burst(P.x,P.y,'#ffffff',60,400);burst(P.x,P.y,G.L.color,40,300);G.shake=20;
 const now=actx.currentTime;if(src){src.playbackRate.setValueAtTime(1,now);src.playbackRate.linearRampToValueAtTime(.25,now+1);}
 gain.gain.setValueAtTime(MASTER,now);gain.gain.linearRampToValueAtTime(0,now+1);const s=src;setTimeout(()=>{if(src===s)stopSong();},1100);
 const p=pct();saveBest(p);
 msg={at:performance.now()+900,title:'YOU DIED',sub:`${G.L.name}  ${p}%  BEST ${best(G.li)}%  GRAZE ${G.graze}`,btns:[['RETRY',retry],[G.test?'EDIT':'MENU',toMenu]]};
}
function win(){
 state='win';G.haz.forEach(h=>{if(h.x!=null)burst(h.x,h.y,G.L.color,3,150)});G.haz=[];G.ev=[];
 boss.dead=true;burst(boss.x,boss.y,G.L.color,120,500);burst(boss.x,boss.y,'#ffffff',60,350);G.shake=25;G.flash=1;saveBest(100);
 msg={at:performance.now()+1600,title:'LEVEL COMPLETE',sub:`${G.L.name} CORE DESTROYED  GRAZE ${G.graze}`,btns:[['AGAIN',retry],[G.test?'EDIT':'MENU',toMenu]]};
}
function retry(){ensureAudio();startLevel(G.li,G.song,G.L,G.from,G.test);}
function toMenu(){const back=G&&G.L.custom?(G.test?'edit':'list'):null;stopSong();G=null;msg=null;if(actx&&actx.state==='suspended')actx.resume();
 if(back){state='editor';ED.on=true;ED.screen=back;}else{state='menu';ED.on=false;}playMenuMusic();}
function pause(){if(state!=='play')return;state='paused';actx.suspend();
 msg={at:0,title:'PAUSED',sub:`${G.L.name}  ${pct()}%`,btns:[['RESUME',resume],['RESTART',retry],[G.test?'EDIT':'MENU',toMenu]]};}
function resume(){if(state!=='paused')return;msg=null;actx.resume();state='play';}

// ---------- update ----------
function update(dt){
 const t=G.t=actx.currentTime-startAt;
 while(G.bi<G.beats.length&&G.beats[G.bi].t-G.bp<=t)onBeat(G.bi++);
 if(G.ev.length){const due=[];G.ev=G.ev.filter(e=>e.t<=t?(due.push(e),false):true);due.sort((a,b)=>a.t-b.t).forEach(e=>{G.ctx={s:e.s,n:0};G.rng=mulberry(e.s);e.fn();});}
 if(state!=='play')return;
 if(t>=G.dur){win();return;}
 if(boss.tw){const w=boss.tw,p=clamp((t-w.t0)/Math.max(.001,w.t1-w.t0)),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
  boss.x=lerp(w.x0,w.x1,e);boss.y=lerp(w.y0,w.y1,e);boss.z=Math.sin(p*Math.PI)*w.hop;if(p>=1){boss.tw=null;boss.z=0;}}
 let mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
 if(mx&&my){mx*=Math.SQRT1_2;my*=Math.SQRT1_2;}
 if(G.pull&&t<G.pull.t1){const dx=boss.x-P.x,dy=boss.y-P.y,d=Math.hypot(dx,dy)||1;P.x+=dx/d*G.pull.str*dt;P.y+=dy/d*G.pull.str*dt;
  if(Math.random()<.6){const a=Math.random()*TAU;G.parts.push({x:boss.x+Math.cos(a)*560,y:boss.y+Math.sin(a)*560,vx:-Math.cos(a)*900,vy:-Math.sin(a)*900,life:.9,s:4,c:G.L.mid});}}
 P.x=clamp(P.x+mx*280*dt,10,W-10);P.y=clamp(P.y+my*280*dt,10,H-10);P.inv=Math.max(0,P.inv-dt);
 G.trail.push({x:P.x,y:P.y});if(G.trail.length>6)G.trail.shift();
 if(t>2&&boss.z<.5&&!boss.dead){
  // the core and the three squares orbiting it always hurt on contact
  if(Math.hypot(P.x-boss.x,P.y-boss.y)<28+PH)hurt();
  else{const r=44*(1+boss.pulse*.18)*(1+boss.z*.5)+22;
   for(let j=0;j<3;j++){const a=boss.rot*-1.5+j*TAU/3;if(Math.abs(P.x-boss.x-Math.cos(a)*r)<4.5+PH&&Math.abs(P.y-boss.y-Math.sin(a)*r)<4.5+PH){hurt();break;}}}}
 const inRect=(x,y,w,h)=>P.x+PH>x&&P.x-PH<x+w&&P.y+PH>y&&P.y-PH<y+h;
 for(const h of G.haz){
  switch(h.type){
   case'bullet':{
    if(h.cx!=null){h.r+=h.vr*dt;h.a+=h.va*dt;h.x=h.cx+Math.cos(h.a)*h.r;h.y=h.cy+Math.sin(h.a)*h.r;}
    else{
     if(h.curve){const c=Math.cos(h.curve*dt),sn=Math.sin(h.curve*dt),vx=h.vx;h.vx=vx*c-h.vy*sn;h.vy=vx*sn+h.vy*c;h.curve*=1-dt*.45;}
     if(h.drag){const f=Math.max(0,1-h.drag*dt);h.vx*=f;h.vy*=f;}
     h.x+=h.vx*dt;h.y+=h.vy*dt;
     if(h.wob)h.x+=Math.cos((t-h.t0)*h.wob+h.ph)*h.wa*dt;
     if(h.bounce>0){let b=0;if(h.x<6||h.x>W-6){h.vx*=-1;h.x=clamp(h.x,6,W-6);b=1;}if(h.y<6||h.y>H-6){h.vy*=-1;h.y=clamp(h.y,6,H-6);b=1;}
      if(b){h.bounce--;burst(h.x,h.y,G.L.light,4,120);}}}
    if(h.split&&t>=h.split){h.dead=1;const o=h.rs*TAU;for(let j=0;j<h.n;j++)bullet(h.x,h.y,o+j*TAU/h.n,170*G.S,11);burst(h.x,h.y,G.L.color,10);break;}
    if(h.sink&&Math.hypot(h.x-boss.x,h.y-boss.y)<34){h.dead=1;break;}
    if(h.cx!=null?h.r>900:(h.x<-60||h.x>W+60||h.y<-60||h.y>H+60)){h.dead=1;break;}
    const d=Math.hypot(P.x-h.x,P.y-h.y);
    if(d<h.s*.4+PH){h.nog=1;hurt(h);}
    else if(d<h.s*.4+PH+22){if(P.inv<=0)h.near=1;}
    else if(h.near){h.near=0;if(!h.nog&&!h.gz&&P.inv<=0){h.gz=1;G.graze++;G.parts.push({x:P.x,y:P.y,vx:(P.x-h.x)*4,vy:(P.y-h.y)*4,life:.35,s:4,c:'#ffffff'});}}
    break;}
   case'rect':if(t>=h.t0){h.x+=h.vx*dt;h.y+=h.vy*dt;if(inRect(h.x+3,h.y+3,h.w-6,h.h-6))hurt();
    if(t>h.t1||(t>h.t0+.3&&(h.x>W+100||h.x+h.w<-100||h.y>H+100||h.y+h.h<-100)))h.dead=1;}break;
   case'laser':if(h.follow){h.x=boss.x;h.y=boss.y;}
    if(t>=h.t0){if(t>h.t1){h.dead=1;break;}h.ang+=h.rot*dt;const w=laserW(h,t);
     if(w>h.w*.5&&Math.abs((P.x-h.x)*Math.sin(h.ang)-(P.y-h.y)*Math.cos(h.ang))<w/2*.8+PH)hurt();}break;
   case'ring':{const r=h.r0+h.vr*(t-h.t0);h.r=r;if(h.dmg&&r<h.rMax&&Math.abs(Math.hypot(P.x-h.x,P.y-h.y)-r)<h.th/2+PH)hurt();if(r>h.rMax+60||r<0)h.dead=1;break;}
   case'hex':if(t>=h.t0){h.R=h.R0+h.v*(t-h.t0);if(h.R>1100){h.dead=1;break;}
    const dx=P.x-h.x,dy=P.y-h.y,d=Math.hypot(dx,dy);let th=((Math.atan2(dy,dx)-h.rot)%TAU+TAU)%TAU;const side=Math.floor(th/(TAU/6))%6;
    if(side!==h.gap&&side!==(h.gap+1)%6){const ed=h.R*Math.cos(Math.PI/6)/Math.cos(th-(side+.5)*TAU/6);if(Math.abs(d-ed)<h.th/2+PH)hurt();}}break;
   case'mark':case'dashwarn':if(t>h.t1)h.dead=1;break;
   case'bomb':{const p=clamp((t-h.ts)/(h.te-h.ts)),e=1-Math.pow(1-p,3);h.x=lerp(h.sx,h.tx,e);h.y=lerp(h.sy,h.ty,e);
    if(Math.hypot(P.x-h.x,P.y-h.y)<9+PH)hurt();
    if(t>=h.te){h.dead=1;const o=h.rs*TAU;for(let j=0;j<h.n;j++)bullet(h.x,h.y,o+j*TAU/h.n,180*G.S,11);
     G.haz.push({type:'ring',x:h.x,y:h.y,r0:10,vr:500,th:12,rMax:66,t0:t,dmg:true});burst(h.x,h.y,G.L.color,15);G.shake=Math.max(G.shake,5);}break;}
  }
  if(state!=='play')break;
 }
 G.haz=G.haz.filter(h=>!h.dead);
}
function hexDraw(h,R){ctx.lineCap='square';for(let j=0;j<6;j++){if(j===h.gap||j===(h.gap+1)%6)continue;const a1=h.rot+j*TAU/6,a2=a1+TAU/6;
 ctx.beginPath();ctx.moveTo(h.x+Math.cos(a1)*R,h.y+Math.sin(a1)*R);ctx.lineTo(h.x+Math.cos(a2)*R,h.y+Math.sin(a2)*R);ctx.stroke();}ctx.lineCap='butt';}
function laserW(h,t){const a=clamp((t-h.t0)/.08),b=clamp((h.t1-t)/.1);return h.w*Math.min(a,b);}

// ---------- draw ----------
function draw(dt){
 uiPrev=ui;ui=[];ctx.setTransform(RES,0,0,RES,0,0);ctx.globalAlpha=1;
 if(!G){if(ED.on)drawEditor();else drawMenu();if(state==='loading')drawBox('LOADING',loadMsg,[],LEVELS[sel].color);
  if(modal){ui=[];drawBox(modal.title,modal.sub,modal.btns,modal.col||'#ffffff');}
  posterize(ED.on&&ED.screen==='edit'&&ED.lv?edPal(ED.lv.color):MENU_PAL);return;}
 drawGame(dt);
 if(msg&&performance.now()>=msg.at)drawBox(msg.title,msg.sub,msg.btns,G.L.color);
 posterize(G.L.pal);
}
function drawGame(dt){
 const L=G.L,t=G.t,col=L.color;
 G.shake=Math.max(0,G.shake-dt*40);G.flash=Math.max(0,G.flash-dt*2);G.hitFlash=Math.max(0,G.hitFlash-dt*3);G.pulse=Math.max(0,G.pulse-dt*4);boss.pulse=Math.max(0,boss.pulse-dt*5);
 boss.rot+=dt*(.8+(G.tier=='hype'?1.6:G.tier=='calm'?.6:0));
 for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;}G.parts=G.parts.filter(p=>p.life>0);
 ctx.fillStyle=L.bg;ctx.fillRect(0,0,LW,LH);
 // pixel grid pulsing on the beat
 ctx.fillStyle=G.pulse>.4?L.dim:mix(L.bg,col,.14);const off=Math.floor(t*6)%20;
 for(let x=-off;x<LW;x+=20)ctx.fillRect(x,0,1,LH);for(let y=-off;y<LH;y+=20)ctx.fillRect(0,y,LW,1);
 if(analyser&&state!=='paused'){analyser.getByteFrequencyData(freq);ctx.fillStyle=mix(L.bg,col,.14);
  for(let i=0;i<40;i++){const v=freq[i+2]/255,h=Math.round(v*v*50);ctx.fillRect(i*8,LH-h,7,h);}}
 const sx=Math.round((Math.random()-.5)*G.shake/3),sy=Math.round((Math.random()-.5)*G.shake/3);
 ctx.setTransform(RES/3,0,0,RES/3,sx*RES,sy*RES);
 const blink=Math.floor(performance.now()/90)%2;
 // warnings
 for(const h of G.haz){
  const wc=blink?L.mid:L.dim;
  if(h.type=='mark'){ctx.strokeStyle=wc;ctx.lineWidth=6;ctx.setLineDash([18,12]);ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  else if(h.type=='dashwarn'){ctx.strokeStyle=wc;ctx.lineWidth=h.w;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(h.x1,h.y1);ctx.lineTo(h.x2,h.y2);ctx.stroke();}

  ui.push({x,y,w:cw-1,h:ch,fn:()=>{ED.sel=b;ED.naming=false;}});}
 if(maxS>0){btn(308,y0,10,ch,'^','#ffffff',()=>{ED.scroll=Math.max(0,ED.scroll-1);ED.sel=Math.max(0,ED.sel-per);});
  btn(308,y0+2*(ch+2),10,ch,'V','#ffffff',()=>{ED.scroll=Math.min(maxS,ED.scroll+1);ED.sel=Math.min(nb-1,ED.sel+per);});}
 // attack palette: click to fill the selected box, then it moves to the next box
 ATK.forEach((a,i)=>{const x=4+(i%8)*39,y=140+Math.floor(i/8)*11,on=lv.blocks[ED.sel]===a[0];
  btn(x,y,38,10,a[1],on?'#ffffff':c,()=>{lv.blocks[ED.sel]=a[0];ED.sel=Math.min(nb-1,ED.sel+1);ED.naming=false;saveLevels();});});
 txt('CLICK A BOX THEN AN ATTACK - ARROWS MOVE - DEL = AUTO - T = TEST',LW/2,190,'#3a3a4a',1,1);}
function edKey(e){
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Backspace'].includes(e.code))e.preventDefault();
 if(e.code==='Escape'){if(ED.naming){ED.naming=false;saveLevels();}else if(ED.screen==='edit'){saveLevels();ED.screen='list';}else{ED.on=false;state='menu';}return;}
 if(ED.screen!=='edit'||!ED.lv)return;const lv=ED.lv,nb=lv.blocks.length;
 if(ED.naming){if(e.code==='Enter'){ED.naming=false;saveLevels();}else if(e.code==='Backspace'){lv.name=ED.fresh?'':lv.name.slice(0,-1);ED.fresh=false;}
  else if(e.key.length===1){const ch=e.key.toUpperCase();if(FONT[ch]||ch===' '){if(ED.fresh)lv.name='';ED.fresh=false;if(lv.name.length<18)lv.name+=ch;}}return;}
 if(e.code==='ArrowRight')ED.sel=Math.min(nb-1,ED.sel+1);
 if(e.code==='ArrowLeft')ED.sel=Math.max(0,ED.sel-1);
 if(e.code==='ArrowDown')ED.sel=Math.min(nb-1,ED.sel+20);
 if(e.code==='ArrowUp')ED.sel=Math.max(0,ED.sel-20);
 if(e.code==='Delete'||e.code==='Backspace'){lv.blocks[ED.sel]='auto';saveLevels();}
 if(e.code==='KeyT'&&!e.repeat)playCustom(lv,true);}

// ---------- input & loop ----------
function toLocal(e){const r=cv.getBoundingClientRect();mouse.x=Math.floor((e.clientX-r.left)/r.width*LW);mouse.y=Math.floor((e.clientY-r.top)/r.height*LH);}
cv.addEventListener('mousemove',toLocal);
cv.addEventListener('mouseleave',()=>{mouse.x=mouse.y=-1;});
cv.addEventListener('click',e=>{toLocal(e);menuMusicSoon();for(const b of uiPrev)if(mouse.x>=b.x&&mouse.x<b.x+b.w&&mouse.y>=b.y&&mouse.y<b.y+b.h){b.fn();break;}});
addEventListener('keydown',e=>{menuMusicSoon();
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 keys[e.code]=true;
 if(modal){if(e.code==='Escape')modal=null;return;}
 if(state==='editor'){edKey(e);return;}
 if(e.repeat)return;
 if(state==='menu'){
  if(e.code==='ArrowRight'||e.code==='KeyD')sel=(sel+1)%6;
  if(e.code==='ArrowLeft'||e.code==='KeyA')sel=(sel+5)%6;
  if(e.code==='ArrowDown'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='KeyS')sel=(sel+3)%6;
  if(e.code==='Enter'||e.code==='Space')playLevel(sel);
  if(e.code==='KeyM')pickSong(sel);
  if(e.code==='Minus')setVol(vol-1);
  if(e.code==='Equal')setVol(vol+1);
  return;}
 if(e.code==='Escape'){if(state==='play')pause();else if(state==='paused')resume();else if(state==='dead'||state==='win')toMenu();}
 if((e.code==='KeyR'||e.code==='Enter'||e.code==='Space')&&(state==='dead'||state==='win')&&msg&&performance.now()>=msg.at)retry();
 if(e.code==='KeyR'&&state==='paused')retry();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pause();});
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play')update(dt);
 draw(state==="paused"?0:dt);requestAnimationFrame(loop);}
(async()=>{await DB.open();for(let i=0;i<LEVELS.length;i++){const r=await DB.get(i);if(r)songs[i]={name:r.name,data:r.data};}requestAnimationFrame(loop);})();
</script>
